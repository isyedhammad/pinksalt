# Render.com Blueprint Infrastructure as Code Specification
# Deploy with 1-click on Render: https://render.com
# ==============================================================================

services:
  - type: web
    name: pinksalt-intelligence-portal
    env: python
    region: frankfurt  # or oregon / singapore
    plan: free
    buildCommand: "python -m pip install -r requirements.txt || true"
    startCommand: "python server.py"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
    disk:
      name: pinksalt-data
      mountPath: /var/data
      sizeGB: 1
